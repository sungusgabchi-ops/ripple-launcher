name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle assembleRelease --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash

      # If the build breaks, publish the log so it can be read without signing in.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A 3 build.log | head -150 > build-errors.txt || true
          gh release delete build-failed --yes --cleanup-tag || true
          gh release create build-failed build.log build-errors.txt --prerelease \
            --title "Build failed" --notes "Build ${GITHUB_SHA::7} failed. See build-errors.txt."

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Ripple.apk
          gh release delete build-failed --yes --cleanup-tag || true
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Ripple.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download Ripple.apk on your phone and tap it to install."
